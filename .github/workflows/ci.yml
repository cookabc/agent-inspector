name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
        # 22.5 是 node:sqlite 的下限，24 是开发时用的版本，26 是当前主线 ——
        # 三档都跑，免得下次"新版本 Node 上跑不起来"要等用户来报。
        node: ['22.5.0', '24', '26']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
